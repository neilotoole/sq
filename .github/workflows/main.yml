name: Main Pipeline
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "sq.json" # Updated by scoop; no need to run a new build.
      - "site/**"
  push:
    # No paths-ignore on push: master merges and release tags must always run
    # (paths filtering on tag pushes is unreliable and could skip a release).
    branches: [master]
    tags: ["v*"]
  schedule:
    - cron: "17 9 * * *" # Nightly full suite vs master (UTC; tunable).

  # Allows this workflow to be manually triggered from the Actions tab.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/master'
        && !startsWith(github.ref, 'refs/tags/v') }}

env:
  GORELEASER_VERSION: 2.13.3
  GOLANGCI_LINT_VERSION: v2.13.2
  TPARSE_VERSION: v0.18.0
  BUILD_TAGS: "sqlite_vtable sqlite_stat4 sqlite_fts5 sqlite_introspect sqlite_json sqlite_math_functions"

jobs:
  test-nix:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]

    runs-on: ${{ matrix.os }}

    env:
      # Full run (no -short) nightly, on release tags, and on manual dispatch.
      # The PR/master dev loop runs -short, skipping long-running tests (e.g.
      # large-fixture JSON/XLSX ingest). Coverage is no longer instrumented
      # here; it runs in the dedicated coverage workflow (see coverage.yml, #871).
      FULL_RUN: ${{ github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}

      # Opt in to the live-network test (gh #1158) on the nightly schedule
      # only. Fixtures are otherwise served from a local test server, so PRs,
      # master merges, release tags and the DB matrix never fetch from an
      # external host. Deliberately narrower than FULL_RUN: a flaky fetch must
      # not be able to block a release.
      SQ_TEST_NETWORK: ${{ github.event_name == 'schedule' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # DuckDB downloads non-static extensions into ~/.duckdb on first use
      # (see TestExtensions_AutoloadOnDemand). Cache them so the run does not
      # depend on extensions.duckdb.org being reachable. The key carries the
      # DuckDB engine version (encoded in the duckdb-go module version), so a
      # bump fetches a fresh set instead of carrying old versions forward.
      - name: Resolve DuckDB engine version
        id: duckdb
        shell: bash
        run: echo "engine=$(go list -m -f '{{.Version}}' github.com/duckdb/duckdb-go/v2)" >> "$GITHUB_OUTPUT"

      - name: Cache DuckDB extensions
        uses: actions/cache@v6
        with:
          path: ~/.duckdb/extensions
          key: duckdb-ext-${{ runner.os }}-${{ steps.duckdb.outputs.engine }}-${{ hashFiles('drivers/duckdb/**/*_test.go') }}
          restore-keys: |
            duckdb-ext-${{ runner.os }}-${{ steps.duckdb.outputs.engine }}-

      - name: Build
        run: go build -tags '${{ env.BUILD_TAGS }}' -v ./...

      - name: "Go tests"
        shell: bash
        run: |
          # pipefail so a `go test` failure isn't masked by the `| tee` below.
          set -eo pipefail

          test_args=()
          if [ "${FULL_RUN}" != "true" ]; then
            # Dev loop (PRs, master merges): skip long-running tests. The full
            # suite runs nightly and on release tags.
            test_args=(-short)
          fi

          go test -tags '${{ env.BUILD_TAGS }}' -timeout 20m -v -json \
            "${test_args[@]}" ./... | tee gotest.out.json

      - name: "Test output"
        if: always()
        shell: bash
        run: |
          set -e
          go install github.com/mfridman/tparse@${{ env.TPARSE_VERSION }}
          tparse -all -sort=elapsed -file gotest.out.json

  test-windows-smoke:
    # Fast Windows check for the dev loop: compile everything (catches
    # CGO/SQLite breakage) and run only the focused smoke suite. Runs on every
    # PR and on master merges; the full suite runs nightly and on release tags.
    if: >-
      github.event_name == 'pull_request'
      || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -tags '${{ env.BUILD_TAGS }}' -v ./...

      - name: Smoke tests
        run: go test -tags '${{ env.BUILD_TAGS }}' -timeout 10m -v ./test/smoke/...

  test-windows-full:
    # Full Windows suite. Runs nightly against master, on release tags (it
    # gates publish), and on manual dispatch — not on PRs or master merges,
    # which get the fast smoke check above.
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      # Copied from https://github.com/mattn/go-sqlite3/blob/master/.github/workflows/go.yaml#L73
      #    - uses: msys2/setup-msys2@v2
      #      with:
      #        update: true
      #        install: mingw-w64-x86_64-toolchain mingw-w64-x86_64-sqlite3
      #        msystem: MINGW64
      #        path-type: inherit
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # DuckDB downloads non-static extensions into ~/.duckdb on first use
      # (see TestExtensions_AutoloadOnDemand). Cache them so the run does not
      # depend on extensions.duckdb.org being reachable. The key carries the
      # DuckDB engine version (encoded in the duckdb-go module version), so a
      # bump fetches a fresh set instead of carrying old versions forward.
      - name: Resolve DuckDB engine version
        id: duckdb
        shell: bash
        run: echo "engine=$(go list -m -f '{{.Version}}' github.com/duckdb/duckdb-go/v2)" >> "$GITHUB_OUTPUT"

      - name: Cache DuckDB extensions
        uses: actions/cache@v6
        with:
          path: ~/.duckdb/extensions
          key: duckdb-ext-${{ runner.os }}-${{ steps.duckdb.outputs.engine }}-${{ hashFiles('drivers/duckdb/**/*_test.go') }}
          restore-keys: |
            duckdb-ext-${{ runner.os }}-${{ steps.duckdb.outputs.engine }}-

      - name: Build
        run: go build -tags '${{ env.BUILD_TAGS }}' -v ./...
      #      shell: msys2 {0}

      #    - name: Run tests
      #      run: |
      #        go test -tags '${{ env.BUILD_TAGS }}' -v ./...
      ##      shell: msys2 {0}

      - name: "Go tests"
        shell: bash
        run: |
          # set -e

          # We send the Go test output to a file, so that "tparse" can
          # render pretty output below.
          go test -tags '${{ env.BUILD_TAGS }}' -timeout 20m -v -json ./... > gotest.out.json

      - name: "Test output"
        if: always()
        shell: bash
        run: |
          set -e
          go install github.com/mfridman/tparse@${{ env.TPARSE_VERSION }}
          tparse -all -sort=elapsed -file gotest.out.json

  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the import-format check can diff a PR against its
          # base commit (github.event.pull_request.base.sha).
          fetch-depth: 0

      - name: Lint GH workflow files
        run: |
          # From https://github.com/rhysd/actionlint
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: shellcheck
        run: |
          shellcheck ./install.sh scripts/fmt-go-imports.sh scripts/build-db-matrix.sh scripts/dedup-db-matrix.sh scripts/build-db-matrix_test.sh scripts/dedup-db-matrix_test.sh
          # Hermetic unit tests for the shared DB-matrix scripts (no network;
          # dedup stubs docker on PATH).
          bash scripts/build-db-matrix_test.sh
          bash scripts/dedup-db-matrix_test.sh

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check Go import formatting
        shell: bash
        run: |
          set -euo pipefail
          # Almost no one runs `make fmt` locally, so import grouping/aliasing is
          # enforced here. PRs check only their changed files (fast, ~1s); other
          # events re-check the whole module (--all) as a full-tree safety net.
          # See scripts/fmt-go-imports.sh for why --all is slow.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/fmt-go-imports.sh --base "${{ github.event.pull_request.base.sha }}"
          else
            bash scripts/fmt-go-imports.sh --all
          fi
          if ! git diff --quiet -- '*.go'; then
            echo "::error::Go imports are not formatted. Run 'make fmt' locally and commit the result."
            git --no-pager diff -- '*.go'
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          skip-cache: true
          install-mode: "binary"
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  binaries-darwin:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: GoReleaser (build darwin binaries)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser-pro
          version: ${{ env.GORELEASER_VERSION }}
          args: build --skip=validate --clean -f .goreleaser-darwin.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      - name: Upload assets (darwin)
        uses: actions/upload-artifact@v7
        with:
          name: dist-darwin
          path: dist-darwin

  binaries-linux-amd64:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: GoReleaser (build linux-amd64 binaries)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser-pro
          version: ${{ env.GORELEASER_VERSION }}
          args: build --skip=validate --clean -f .goreleaser-linux-amd64.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      - name: Upload assets (linux-amd64)
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux-amd64
          path: dist-linux

  binaries-linux-arm64:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install toolchain dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: GoReleaser (build linux-arm64 binaries)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser-pro
          version: ${{ env.GORELEASER_VERSION }}
          args: build --skip=validate --clean -f .goreleaser-linux-arm64.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      - name: Upload assets (linux-arm64)
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux-arm64
          path: dist-linux

  binaries-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: GoReleaser (build windows binaries)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser-pro
          version: ${{ env.GORELEASER_VERSION }}
          args: build --skip=validate --clean -f .goreleaser-windows.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      - name: Upload assets (windows)
        uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: dist-windows

  db-release:
    # Every engine at every supported version, gating publish and
    # docker-publish (gh #1133). Legs run in parallel, so this adds roughly
    # 12 minutes of wall clock to a release, more when the legs queue behind
    # the other release jobs (the account runs at most 20 jobs at once).
    # fail-fast is off inside db-integration.yml, so one flaky leg can be
    # rerun alone. Waits for lint so a tag with a lint or workflow error does
    # not spin up nineteen legs first.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint]
    uses: ./.github/workflows/db-integration.yml
    with:
      selection: '{"*":["all"]}'

  publish:
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - lint
      - test-nix
      - test-windows-full
      - binaries-darwin
      - binaries-linux-amd64
      - binaries-linux-arm64
      - binaries-windows
      - db-release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download darwin artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-darwin
          path: dist-darwin

      - name: Download linux-amd64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-linux-amd64
          path: dist-linux

      - name: Download linux-arm64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-linux-arm64
          path: dist-linux

      - name: Download windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-windows
          path: dist-windows

      - name: GoReleaser (publish)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser-pro
          version: ${{ env.GORELEASER_VERSION }}
          args: release -f .goreleaser.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          AUR_PRIVATE_KEY: ${{ secrets.AUR_PRIVATE_KEY }}

  docker-publish:
    # Build and push the Docker image to ghcr.io and Docker Hub. Runs as a
    # sibling of `publish` (gated by the same lint/test jobs, plus the linux
    # binary builds it consumes), not behind test-install, so the image ships
    # alongside every other release artifact and is never withheld by an
    # unrelated install-test failure on some other platform. GoReleaser builds
    # the image from the linux release binaries (.goreleaser-docker.yml +
    # packages/docker/alpine.Dockerfile), so the image always matches this
    # exact release. test-install smoke-tests the published image afterward.
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - lint
      - test-nix
      - test-windows-full
      - binaries-linux-amd64
      - binaries-linux-arm64
      - db-release
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing via sigstore/fulcio.
      attestations: write # SLSA provenance + SBOM attestations.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download linux-amd64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-linux-amd64
          path: dist-linux

      - name: Download linux-arm64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-linux-arm64
          path: dist-linux

      # Add support for more platforms with QEMU; needed to build the
      # linux/arm64 image on the amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log into registry ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is the second publish target. This login also supplies the
      # auth that the attestation steps below need to push OCI referrers.
      - name: Log into registry docker.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: GoReleaser (docker publish)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser-pro
          version: ${{ env.GORELEASER_VERSION }}
          args: release -f .goreleaser-docker.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      # GoReleaser pushed identical manifest lists to both registries, so they
      # share a single content-addressed digest. Capture it once here; the steps
      # below attest that one digest under each registry's subject name.
      - name: Capture image digest
        id: digest
        env:
          IMAGE: ghcr.io/neilotoole/sq:${{ github.ref_name }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Image digest: $digest"

      # SLSA build provenance, attached to each image as an OCI referrer and
      # recorded in this repo's GitHub attestation store. Attesting the final
      # stitched digest, rather than enabling buildx `--provenance` on the
      # per-arch builds, avoids the wrapper-index problem that arises when
      # already-attested per-arch images are merged into a manifest list.
      - name: Attest provenance (ghcr.io)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/neilotoole/sq
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Attest provenance (docker.io)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: docker.io/neilotoole/sq
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      # Software Bill of Materials. syft scans the linux/amd64 image (the
      # runner's arch); both arches carry the same Alpine packages, so one SBOM
      # is attested against the multi-arch index digest.
      - name: Generate SBOM
        # Strip per-file metadata. Syft's default file cataloging records
        # metadata for every file in the image, which on a large image pushes
        # the SPDX past actions/attest's 16 MiB predicate limit. This keeps the
        # package inventory, which is what vulnerability scanners consume, and
        # drops the heavy per-file data. sq's Alpine image is small enough to
        # fit either way; it is set for correctness and headroom.
        env:
          SYFT_FILE_METADATA_SELECTION: none
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/neilotoole/sq@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      # Uses the unified actions/attest; actions/attest-sbom is deprecated, and
      # its bundle did not verify as an OCI referrer.
      - name: Attest SBOM (ghcr.io)
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/neilotoole/sq
          subject-digest: ${{ steps.digest.outputs.digest }}
          predicate-type: https://spdx.dev/Document
          predicate-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest SBOM (docker.io)
        uses: actions/attest@v4
        with:
          subject-name: docker.io/neilotoole/sq
          subject-digest: ${{ steps.digest.outputs.digest }}
          predicate-type: https://spdx.dev/Document
          predicate-path: sbom.spdx.json
          push-to-registry: true

      # Independently verify what was just pushed. A green attest step means
      # "uploaded", not "verifiable", so gate the release on real verification.
      # GitHub's attestation store is written synchronously and is the hard
      # gate. The registry referrer, which is what Docker Scout reads, can lag
      # briefly after push, so those reads are retried.
      - name: Verify attestations
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          SPDX=https://spdx.dev/Document
          retry() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              [ "$n" -ge 5 ] && return 1
              echo "not ready (attempt $n), retrying..."
              sleep 6
            done
          }
          for reg in ghcr.io docker.io; do
            ref="oci://$reg/neilotoole/sq@${DIGEST}"
            echo "::group::verify $ref"
            gh attestation verify "$ref" --repo neilotoole/sq
            gh attestation verify "$ref" --repo neilotoole/sq --predicate-type "$SPDX"
            retry gh attestation verify "$ref" --repo neilotoole/sq --bundle-from-oci
            retry gh attestation verify "$ref" --repo neilotoole/sq --bundle-from-oci --predicate-type "$SPDX"
            echo "::endgroup::"
          done
          echo "Verified provenance + SBOM, store + referrer, on both registries."

      # Sync the image's README to the Docker Hub repository description. This
      # is cosmetic and runs after the image is already published, so a failure
      # here must never fail the release: the description API needs the account
      # password or a token with description-write scope, which a push-only
      # token does not have. Check the run log to confirm the sync happened.
      - name: Sync README to Docker Hub description
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: neilotoole/sq
          readme-filepath: ./packages/docker/README.md

  test-install:
    # Verify that install mechanisms work across the supported platforms,
    # including the Docker image. Runs *after* both publish and docker-publish,
    # so every release channel is already live by the time it runs — it gates
    # nothing. A failure here means users are already hitting the problem, so
    # fix it ASAP; this is a post-publish canary, not a pre-publish guard.
    needs:
      - publish
      - docker-publish
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/test-install.yml
